name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit-checks:
    # Keep Python 3.8 coverage for Ubuntu 20.04-era production hosts.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate shell syntax
        run: for script in ./*.sh; do bash -n "$script" || exit; done
      - name: Test read-only file checks
        run: python3 -m unittest discover -s tests -v
